name: Build and refresh BahiKhata.com

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 1 * * *" # every day at 06:47 IST: refresh news, sitemap dates and rebuild
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install markdown pillow

      - name: Refresh news headlines
        run: python scripts/update_feeds.py
        continue-on-error: true

      - name: Draw share image and app icons
        run: python scripts/make_images.py
        continue-on-error: true

      - name: Build pages, sitemap, search index and service worker
        run: python scripts/build.py

      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated build and content refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to republish
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
